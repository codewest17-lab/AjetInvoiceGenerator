name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_variant:
        description: "Gradle build variant"
        required: true
        default: "assembleRelease"
        type: choice
        options:
          - assembleRelease
          - assembleDebug

env:
  BUILD_VARIANT: ${{ github.event.inputs.build_variant || 'assembleRelease' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Fails fast with a clear message if app.json / plugin config is broken,
      # instead of discovering it deep inside a native gradle build.
      - name: Validate Expo config
        run: npx expo config --type public --json > /dev/null

      # Catches JS syntax errors, bad imports, and missing modules by
      # actually building the JS bundle — before we spend time compiling
      # the native Android project.
      - name: Validate JS bundle (catches build-breaking JS errors)
        run: |
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file node_modules/expo/AppEntry.js \
            --bundle-output /tmp/index.android.bundle \
            --assets-dest /tmp/bundle-assets \
            --reset-cache

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle', 'android/app/build.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build APK
        working-directory: android
        run: ./gradlew ${{ env.BUILD_VARIANT }} --stacktrace --no-daemon

      # Sanity-checks the produced APK is valid and correctly signed/aligned
      # before we call the job successful, catching a corrupt build output
      # that would otherwise fail to install (and surface as a "crash") on
      # a real device.
      - name: Verify APK integrity
        run: |
          set -e
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK was produced." >&2
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          "$ANDROID_HOME"/build-tools/*/aapt2 dump badging "$APK_PATH" > /dev/null || \
            "$ANDROID_SDK_ROOT"/build-tools/*/aapt dump badging "$APK_PATH" > /dev/null
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AjetInvoiceGenerator-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
